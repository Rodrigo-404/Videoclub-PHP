services:
  videoclub:
    build: ../backend/
    container_name: videoclub
    image: videoclub_php:latest
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html/videoclub
    environment:
      - XDEBUG_MODE=debug
      - PHP_IDE_CONFIG=serverName=localhost
    networks:
      - videoclub_php